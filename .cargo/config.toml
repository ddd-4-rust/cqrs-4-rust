# Stub config. CI-safe in the sense that no registry is actively
# resolved against the network. The `ddd4rust-local` registry is
# declared (so cargo's metadata can parse ddd-4-rust's Cargo.toml
# references) but pointed at a non-existent path so cargo will fail
# loudly if any crate actually tries to use it (rather than silently
# hitting the network and waiting for a timeout).
#
# Local developers with a Ktra-based mirror running on 127.0.0.1:18000
# should `cp .cargo/config.toml.example .cargo/config.toml` to enable
# the mirror.

[registries.ddd4rust-local]
index = "sparse+http://127.0.0.1:18000/index/"
credential-provider = "cargo:token"
