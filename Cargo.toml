[workspace]
resolver = "2"
members = [
    "core",
    "serde",
    "esc",
    "actix",
    "axum",
    "test",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "LGPL-3.0-or-later"
authors = ["Michael Schnell"]
repository = "https://github.com/ddd-4-rust/cqrs-4-rust"

[patch.crates-io]
ddd-4-rust-core = { path = "../ddd-4-rust/core" }
ddd-4-rust-serde = { path = "../ddd-4-rust/serde" }
ddd-4-rust-esc = { path = "../ddd-4-rust/esc" }
