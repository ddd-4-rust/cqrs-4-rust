# GitHub Actions: core CI for cqrs-4-rust
#
# Runs on every push to main / dev and every pull_request.
# Gates (each is its own job so a single failure doesn't block others):
#   1. fmt (rustfmt)
#   2. check (workspace)
#   3. test (workspace, e2e-skipped via RUN_E2E=0)
#   4. clippy (-D warnings)
#   5. doc (workspace, no-deps)
#   6. parity (140-file migration baseline)
#
# Design notes:
# - All `with:` blocks use scalar / comma-string form. GitHub Actions'
#   workflow parser rejects flow-style YAML sequences ([a, b]) inside
#   `with:` — error "A sequence was not expected".
# - rust-toolchain.toml pins `channel = "1.88.0"`; we use the
#   `@1.88.0` action tag (no explicit `toolchain:` input needed).
#   In previous revisions we added a `toolchain-smoke` matrix job
#   that passed `toolchain:` alongside the `@1.88.0` tag, which
#   dtolnay/rust-toolchain rejects as an invalid input combination
#   ("Unexpected input(s) 'toolchain', valid inputs are ['targets',
#   'target', 'components']"). The job was removed.
# - Swatinem/rust-cache@v2 was previously included for cargo build
#   caching; it has been removed because the `workspaces:` input
#   semantics differ from the workspace *root* name we pass and
#   the additional setup step occasionally cancelled the cached
#   step on first-run runners. Re-add later as a perf optimisation
#   once the baseline CI is green.
# - The local registry declared in `.cargo/config.toml`
#   (`[registries.ddd4rust-local] index = "sparse+http://127.0.0.1:18000/index/"`)
#   is a developer-only mirror. CI neutralises it via
#   `CARGO_REGISTRIES_DDD4RUST_LOCAL_INDEX=""`.
# - RUN_E2E=0 keeps `#[ignore = "needs container"]` integration
#   tests skipped. The e2e.yml workflow overrides this to RUN_E2E=1
#   with real KurrentDB/MariaDB services.

name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# Cancel in-progress runs of the same workflow when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Neutralise the developer-only local registry so Cargo doesn't try
  # to reach 127.0.0.1:18000 from CI runners.
  CARGO_REGISTRIES_DDD4RUST_LOCAL_INDEX: ""
  CARGO_NET_OFFLINE: "false"
  RUST_BACKTRACE: "1"
  # Skip `#[ignore = "needs container"]` integration tests by default.
  RUN_E2E: "0"

jobs:
  fmt:
    name: fmt (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone sibling workspace (ddd-4-rust)
        # cqrs-4-rust depends on ddd-4-rust-* via path deps pointing at
        # ../ddd-4-rust. CI clones the sibling into $GITHUB_WORKSPACE/../ so
        # the path resolves. If you fork cqrs-4-rust without ddd-4-rust,
        # set DDD_4_RUST_REPO to a reachable Git URL.
        env:
          DDD_4_RUST_REPO: ${{ vars.DDD_4_RUST_REPO || 'https://github.com/ddd-4-rust/ddd-4-rust.git' }}
        run: |
          if [[ ! -d "$GITHUB_WORKSPACE/../ddd-4-rust" ]]; then
            git clone --depth 1 "$DDD_4_RUST_REPO" "$GITHUB_WORKSPACE/../ddd-4-rust"
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone sibling workspace (ddd-4-rust)
        env:
          DDD_4_RUST_REPO: ${{ vars.DDD_4_RUST_REPO || 'https://github.com/ddd-4-rust/ddd-4-rust.git' }}
        run: |
          if [[ ! -d "$GITHUB_WORKSPACE/../ddd-4-rust" ]]; then
            git clone --depth 1 "$DDD_4_RUST_REPO" "$GITHUB_WORKSPACE/../ddd-4-rust"
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: cargo check --workspace --all-targets --all-features

  test:
    name: test (workspace, e2e skipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone sibling workspace (ddd-4-rust)
        env:
          DDD_4_RUST_REPO: ${{ vars.DDD_4_RUST_REPO || 'https://github.com/ddd-4-rust/ddd-4-rust.git' }}
        run: |
          if [[ ! -d "$GITHUB_WORKSPACE/../ddd-4-rust" ]]; then
            git clone --depth 1 "$DDD_4_RUST_REPO" "$GITHUB_WORKSPACE/../ddd-4-rust"
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - run: cargo test --workspace --all-targets --all-features

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone sibling workspace (ddd-4-rust)
        env:
          DDD_4_RUST_REPO: ${{ vars.DDD_4_RUST_REPO || 'https://github.com/ddd-4-rust/ddd-4-rust.git' }}
        run: |
          if [[ ! -d "$GITHUB_WORKSPACE/../ddd-4-rust" ]]; then
            git clone --depth 1 "$DDD_4_RUST_REPO" "$GITHUB_WORKSPACE/../ddd-4-rust"
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  doc:
    name: doc (workspace, no-deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clone sibling workspace (ddd-4-rust)
        env:
          DDD_4_RUST_REPO: ${{ vars.DDD_4_RUST_REPO || 'https://github.com/ddd-4-rust/ddd-4-rust.git' }}
        run: |
          if [[ ! -d "$GITHUB_WORKSPACE/../ddd-4-rust" ]]; then
            git clone --depth 1 "$DDD_4_RUST_REPO" "$GITHUB_WORKSPACE/../ddd-4-rust"
          fi
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo doc --workspace --all-features --no-deps

  parity:
    name: migration parity (140/140)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check 140-file migration baseline
        # CI runs in a Rust-only checkout; the Java baseline lives in
        # the sibling `cqrs-4-java` repo. The parity script is bi-modal:
        #   - default: full bidirectional check (requires JAVA_BASELINE)
        #   - SKIP_JAVA=1: Rust side only (used here)
        # Local developers should run without SKIP_JAVA to enforce the
        # 140/140 Java<->Rust bijection end-to-end.
        # This job does NOT need the ddd-4-rust sibling because
        # tools/check_migration_parity.sh only walks the Rust files in
        # this repo (and, if JAVA_BASELINE is set, the Java repo too).
        run: SKIP_JAVA=1 ./tools/check_migration_parity.sh